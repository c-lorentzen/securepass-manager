<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Credential</title>
</head>
<body>

    <h1>Add Credential</h1>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form
        action="{{ url_for('add_credential') }}"
        method="POST"
    >

        <p>
            <label for="website">
                Website or Account Name:
            </label>

            <input
                type="text"
                id="website"
                name="website"
                value="{{ website }}"
                required
            >
        </p>

        <p>
            <label for="website_url">
                Website URL:
            </label>

            <input
                type="url"
                id="website_url"
                name="website_url"
                value="{{ website_url }}"
                placeholder="https://example.com"
            >
        </p>

        <p>
            <label for="login_username">
                Username or Email:
            </label>

            <input
                type="text"
                id="login_username"
                name="login_username"
                value="{{ login_username }}"
                required
            >
        </p>

        <p>
            <label for="saved_password">
                Password:
            </label>

            <input
                type="password"
                id="saved_password"
                name="saved_password"
                required
            >
        </p>

        <p>
            <label for="notes">
                Notes:
            </label>

            <textarea
                id="notes"
                name="notes"
                rows="4"
                cols="40"
            >{{ notes }}</textarea>
        </p>

        <button type="submit">
            Save Credential
        </button>

    </form>

    <p>
        <a href="{{ url_for('dashboard') }}">
            Cancel and Return to Dashboard
        </a>
    </p>

</body>
</html>
