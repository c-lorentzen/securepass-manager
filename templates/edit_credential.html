<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Credential</title>
</head>
<body>

    <h1>Edit Credential</h1>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form
        action="{{ url_for(
            'edit_credential',
            credential_id=credential.id
        ) }}"
        method="POST"
    >

        <p>
            <label for="website">
                Website or Account Name:
            </label>

            <input
                type="text"
                id="website"
                name="website"
                value="{{ credential.website }}"
                required
            >
        </p>

        <p>
            <label for="website_url">
                Website URL:
            </label>

            <input
                type="url"
                id="website_url"
                name="website_url"
                value="{{ credential.website_url }}"
                placeholder="https://example.com"
            >
        </p>

        <p>
            <label for="login_username">
                Username or Email:
            </label>

            <input
                type="text"
                id="login_username"
                name="login_username"
                value="{{ credential.username }}"
                required
            >
        </p>

        <p>
            <label for="saved_password">
                New Password:
            </label>

            <input
                type="password"
                id="saved_password"
                name="saved_password"
            >

            <br>

            <small>
                Leave this field empty to keep the current password
            </small>
        </p>

        <p>
            <label for="notes">
                Notes:
            </label>

            <textarea
                id="notes"
                name="notes"
                rows="4"
                cols="40"
            >{{ credential.notes }}</textarea>
        </p>

        <button type="submit">
            Update Credential
        </button>

    </form>

    <p>
        <a href="{{ url_for(
            'view_credential',
            credential_id=credential.id
        ) }}">
            Cancel and Return to Credential
        </a>
    </p>

</body>
</html>
