Program description: Displays one authorized credential and allows
the password to be shown or hidden -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credential Details</title>
</head>
<body>

    <h1>Credential Details</h1>

    <p>
        <strong>Website:</strong>
        {{ credential.website }}
    </p>

    <p>
        <strong>Website URL:</strong>

        {% if credential.website_url %}
            <a
                href="{{ credential.website_url }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                {{ credential.website_url }}
            </a>
        {% else %}
            Not provided
        {% endif %}
    </p>

    <p>
        <strong>Username:</strong>
        {{ credential.username }}
    </p>

    <p>
        <strong>Password:</strong>

        <input
            type="password"
            id="password"
            value="{{ credential.password }}"
            readonly
        >

        <button
            type="button"
            id="toggleButton"
            onclick="togglePassword()"
        >
            Show Password
        </button>
    </p>

    <p>
        <strong>Notes:</strong>
        {{ credential.notes or "No notes were provided." }}
    </p>

    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

    <script>
        // Shows or hides the decrypted password
        function togglePassword() {

            // Gets the password field
            var passwordField =
                document.getElementById("password");

            // Gets the Show Password button
            var toggleButton =
                document.getElementById("toggleButton");

            // Shows the password when it is currently hidden
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleButton.innerHTML = "Hide Password";
            }

            // Hides the password when it is currently visible
            else {
                passwordField.type = "password";
                toggleButton.innerHTML = "Show Password";
            }
        }
    </script>

</body>
</html>
